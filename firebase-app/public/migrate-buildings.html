<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Migration: Mega-Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-3xl mx-auto bg-white rounded-xl shadow-md p-8">
        <h1 class="text-2xl font-bold mb-6 flex items-center text-emerald-600">
            <i class="fa-solid fa-database mr-3"></i> เครื่องมืออัปเกรดฐานข้อมูล (Mega-Document)
        </h1>

        <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 mb-6 text-sm text-yellow-800 rounded">
            <p class="font-bold"><i class="fa-solid fa-triangle-exclamation mr-1"></i> คำเตือน</p>
            <p>1. ควรงดการใช้งานระบบชั่วคราวระหว่างทำการอัปเกรด (ใช้เวลาประมาณ 1-3 นาที)</p>
            <p>2. การทำงาน: จะอ่านข้อมูลจาก collection `rooms` เดิม นำมาจัดกลุ่มตามตึก และบันทึกลง `buildingRooms`</p>
        </div>

        <!-- Login Section -->
        <div id="loginSection" class="mb-6 p-4 border border-gray-200 rounded-lg bg-gray-50">
            <h2 class="font-bold text-gray-700 mb-2"><i class="fa-solid fa-lock mr-2"></i> กรุณาเข้าสู่ระบบก่อนดำเนินการ</h2>
            <div class="flex gap-4 mb-2">
                <input type="email" id="adminEmail" placeholder="admin@example.com" class="border p-2 rounded w-full text-sm">
                <input type="password" id="adminPassword" placeholder="รหัสผ่าน" class="border p-2 rounded w-full text-sm">
            </div>
            <button onclick="login()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700 transition w-full text-sm">
                เข้าสู่ระบบ
            </button>
            <p id="loginStatus" class="text-xs text-red-500 mt-2 hidden"></p>
        </div>

        <div id="authStatus" class="mb-6 hidden text-emerald-600 font-bold p-3 bg-emerald-50 rounded">
            <i class="fa-solid fa-user-check mr-2"></i> ยืนยันสิทธิ์แล้ว: <span id="userEmailDisplay"></span>
        </div>

        <button id="startBtn" onclick="startMigration()" class="bg-emerald-600 text-white px-6 py-3 rounded-lg font-bold hover:bg-emerald-700 transition shadow-md w-full disabled:bg-gray-400 opacity-50 cursor-not-allowed" disabled>
            <i class="fa-solid fa-bolt mr-2"></i> เริ่มอัปเกรดฐานข้อมูล
        </button>

        <div id="logContainer" class="mt-8 bg-gray-900 text-emerald-400 font-mono text-xs p-4 rounded-lg h-96 overflow-y-auto hidden">
            <!-- Logs will appear here -->
        </div>
    </div>

    <script>
        let isAuth = false;

        // Auth state listener
        auth.onAuthStateChanged(user => {
            if (user) {
                isAuth = true;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('authStatus').classList.remove('hidden');
                document.getElementById('userEmailDisplay').innerText = user.email;
                
                const btn = document.getElementById('startBtn');
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            } else {
                isAuth = false;
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('authStatus').classList.add('hidden');
                
                const btn = document.getElementById('startBtn');
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        });

        async function login() {
            const email = document.getElementById('adminEmail').value;
            const pass = document.getElementById('adminPassword').value;
            const statusLabel = document.getElementById('loginStatus');
            
            try {
                statusLabel.classList.add('hidden');
                await auth.signInWithEmailAndPassword(email, pass);
            } catch (err) {
                statusLabel.innerText = "เข้าสู่ระบบล้มเหลว: " + err.message;
                statusLabel.classList.remove('hidden');
            }
        }

        // Copy of parseRoomInfo from utils.js
        function parseRoomInfo(roomNo) {
            let cleanRoomNo = roomNo.toString().trim();
            if (cleanRoomNo.length < 3) return { building: 'Main', floor: 1, roomIndex: cleanRoomNo, full: cleanRoomNo };

            const len = cleanRoomNo.length;
            const roomIndex = cleanRoomNo.substring(len - 2); 
            const floorChar = cleanRoomNo.substring(len - 3, len - 2); 
            const building = cleanRoomNo.substring(0, len - 3);

            return {
                building: building || 'Main',
                floor: parseInt(floorChar) || 1,
                roomIndex: roomIndex,
                full: cleanRoomNo
            };
        }

        function log(msg, type='info') {
            const container = document.getElementById('logContainer');
            container.classList.remove('hidden');
            const p = document.createElement('p');
            p.className = 'mb-1';
            
            if(type === 'error') p.innerHTML = `<span class="text-red-500">[ERROR]</span> ${msg}`;
            else if(type === 'success') p.innerHTML = `<span class="text-blue-400">[SUCCESS]</span> ${msg}`;
            else if(type === 'warn') p.innerHTML = `<span class="text-yellow-400">[WARN]</span> ${msg}`;
            else p.innerHTML = `<span class="text-gray-400">[INFO]</span> ${msg}`;
            
            container.appendChild(p);
            container.scrollTop = container.scrollHeight;
        }

        async function startMigration() {
            if (!isAuth) {
                log('กรุณาเข้าสู่ระบบก่อนดำเนินการ', 'error');
                return;
            }

            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> กำลังอัปเกรด กรุณารอสักครู่...';
            document.getElementById('logContainer').innerHTML = '';
            
            log('เริ่มกระบวนการอัปเกรด...');

            try {
                // 1. Fetch all rooms
                log('กำลังดึงข้อมูลห้องทั้งหมดจากฐานข้อมูล...');
                const snapshot = await db.collection('rooms').get();
                log(`พบข้อมูลห้องทั้งหมด ${snapshot.docs.length} ห้อง`, 'success');

                if (snapshot.empty) {
                    throw new Error("ไม่พบข้อมูลห้องในระบบ หรือคุณไม่มีสิทธิ์เข้าถึง (ต้องล็อกอินด้วยบัญชี Admin)");
                }

                // 2. Group by Project -> Building
                const projects = {};
                // projects = { "กอล์ฟวิว": { "A": [room1, room2], "B": [room1] } }

                snapshot.docs.forEach(doc => {
                    const data = doc.data();
                    const project = data.project || 'Unknown';
                    const roomNo = data.roomNo || '';
                    
                    if (!roomNo) return;

                    const info = parseRoomInfo(roomNo);
                    const building = info.building;

                    if (!projects[project]) projects[project] = { buildings: {}, totalRooms: 0, statusCount: {} };
                    if (!projects[project].buildings[building]) projects[project].buildings[building] = [];

                    // Clean up data for the array
                    const roomData = {
                        roomNo: roomNo,
                        status: data.status || 'ห้องว่าง',
                        moveInDate: data.moveInDate || '',
                        roomType: data.roomType || 'Standard',
                        remark: data.remark || '',
                        isSampleRoom: !!data.isSampleRoom,
                        bookingDate: data.bookingDate || '',
                        oldDocId: doc.id // Keep reference just in case
                    };

                    projects[project].buildings[building].push(roomData);
                    projects[project].totalRooms++;

                    // Count status
                    projects[project].statusCount[roomData.status] = (projects[project].statusCount[roomData.status] || 0) + 1;
                });

                // 3. Write to buildingRooms
                log('กำลังจัดเตรียมข้อมูลเขียนลงระบบใหม่...');
                
                let batch = db.batch();
                let opsCount = 0;

                for (const project in projects) {
                    const projData = projects[project];
                    log(`โครงการ ${project}: พบ ${Object.keys(projData.buildings).length} ตึก, รวม ${projData.totalRooms} ห้อง`);

                    // Write Summary
                    const summaryRef = db.collection('projectSummary').doc(project);
                    batch.set(summaryRef, {
                        totalRooms: projData.totalRooms,
                        statusCount: projData.statusCount,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    opsCount++;

                    // Write Buildings
                    for (const building in projData.buildings) {
                        const roomsArray = projData.buildings[building];
                        const docId = `${project}_${building}`;
                        const buildRef = db.collection('buildingRooms').doc(docId);
                        
                        batch.set(buildRef, {
                            project: project,
                            building: building,
                            rooms: roomsArray,
                            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                        });
                        opsCount++;

                        if (opsCount >= 400) {
                            await batch.commit();
                            batch = db.batch();
                            opsCount = 0;
                            log(`...บันทึกข้อมูลแล้วส่วนหนึ่ง...`);
                        }
                    }
                }

                // Commit remaining
                if (opsCount > 0) {
                    await batch.commit();
                }

                log('==== อัปเกรดฐานข้อมูลเสร็จสมบูรณ์! ====', 'success');
                btn.innerHTML = '<i class="fa-solid fa-check mr-2"></i> อัปเกรดเสร็จสิ้น (สามารถปิดหน้านี้ได้เลย)';

            } catch (error) {
                log('เกิดข้อผิดพลาด: ' + error.message, 'error');
                btn.disabled = false;
                btn.innerHTML = 'ลองใหม่อีกครั้ง';
            }
        }
    </script>
</body>
</html>
